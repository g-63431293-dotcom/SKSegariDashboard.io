<style>
html,body{margin:0;height:100%;background:#0f2b46;font-family:system-ui,sans-serif}
#f{border:0;width:100%;display:block;position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);height:auto;background:#fff}
#off{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;padding:20px}
#off img{width:96px;border-radius:20px;margin-bottom:12px}
</style>

<body>
<iframe id="f" title="Dashboard SK Segari" allow="fullscreen"></iframe>
<div id="off"><img src="icons/icon-192.png" alt=""><h2>Tiada sambungan internet</h2><p>Sambung semula untuk melihat data terkini.</p><button onclick="location.reload()">Cuba lagi</button></div>
<script>
// GANTI dengan URL web app tunggal (hujung /exec) selepas deploy
const APP_URL = 'https://script.google.com/macros/s/AKfycbx-EGIVDGrOAlPzqSnpjWk_qspy2Jjype-6_Wp1yZuASR66OTHM29l3LwCm1DcXo_yy5A/exec';
const q = new URLSearchParams(location.search), p = new URLSearchParams();
p.set('wrap', '1');                                           // beritahu aplikasi ia berjalan dalam pembalut ini
if (q.get('r')) p.set('r', q.get('r'));
if (q.has('login')) p.set('login', '1');
// Google Sign-In kembali ke halaman ini dengan #id_token=… → hantar kepada aplikasi di dalam iframe, kemudian buang daripada bar alamat
const back = /(^|[#&])id_token=/.test(location.hash) ? location.hash : '';
if (back) history.replaceState(null, '', location.pathname + location.search);
if (!navigator.onLine) { document.getElementById('off').style.display = 'flex'; }
else { document.getElementById('f').src = APP_URL + '?' + p.toString() + back; }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ===== Pasang aplikasi: perantara antara butang "Pasang aplikasi" dalam dashboard (iframe) dan pelayar =====
// beforeinstallprompt hanya dihantar kepada halaman peringkat atas ini, bukan kepada iframe; dashboard bertanya melalui postMessage.
let dp = null, sink = null, justInstalled = false;
const standalone = () => ['standalone', 'minimal-ui', 'fullscreen'].some(m => matchMedia('(display-mode: ' + m + ')').matches) || navigator.standalone === true;
const stateMsg = () => ({ type: 'sk-install-state', can: !!dp, standalone: standalone() || justInstalled, justInstalled: justInstalled });
const push = () => { if (sink) try { sink.postMessage(stateMsg(), '*'); } catch (e) {} };
addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; push(); });
addEventListener('appinstalled', () => { dp = null; justInstalled = true; push(); });
addEventListener('message', async e => {
  const m = e.data || {};
  if (m.type === 'sk-install-query') { sink = e.source; push(); }
  else if (m.type === 'sk-install' && dp) {                      // klik pengguna dalam iframe memberi pengaktifan kepada halaman ini
    sink = e.source; const p = dp; dp = null;
    try { p.prompt(); await p.userChoice; } catch (x) {}
    push();
  }
});
</script>
</body>
